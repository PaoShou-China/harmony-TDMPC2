<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc"><title id="title">Rocket landing trajectory</title><desc id="desc">A simple rocket descends along a curved path toward a marked landing pad, with trajectory and state-estimation motifs.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#16394b"/><stop offset="1" stop-color="#0b1722"/></linearGradient><linearGradient id="flame" x2="0" y2="1"><stop stop-color="#ffe19b"/><stop offset="1" stop-color="#ff8e57" stop-opacity=".2"/></linearGradient></defs><rect width="920" height="540" rx="24" fill="url(#sky)"/><g fill="none" stroke="#6fe1d0" opacity=".22"><circle cx="700" cy="130" r="77"/><circle cx="700" cy="130" r="112"/><path d="M0 416h920M0 448h920"/></g><g stroke="#39596a" stroke-dasharray="4 10"><path d="M0 480h920M90 0v540M830 0v540"/></g><path d="M254 117C407 145 482 224 558 286s91 81 140 117" fill="none" stroke="#6fe1d0" stroke-width="3" stroke-dasharray="9 10"/><circle cx="254" cy="117" r="8" fill="#6fe1d0"/><circle cx="558" cy="286" r="6" fill="#ffca7a"/><g transform="translate(562 259) rotate(38)"><path d="M0-65c22 22 30 45 30 72L0 28-30 7c0-27 8-50 30-72Z" fill="#e7f3f2" stroke="#6fe1d0" stroke-width="3"/><circle cy="-18" r="8" fill="#17394a" stroke="#6fe1d0" stroke-width="3"/><path d="m-30 5-22 15 21 3m61-18 22 15-21 3M-10 26l-5 27 15-12 15 12-5-27" fill="#ffca7a" stroke="#ffca7a" stroke-width="3"/><path d="M-10 34 0 80 10 34Z" fill="url(#flame)"/></g><g transform="translate(684 414)"><path d="M-82 17h164" stroke="#ffca7a" stroke-width="6" stroke-linecap="round"/><path d="M-55 23v16m110-16v16" stroke="#ffca7a" stroke-width="3"/><circle r="11" fill="none" stroke="#6fe1d0" stroke-width="2"/><circle r="3" fill="#6fe1d0"/></g><g font-family="system-ui,sans-serif" fill="#c8d9df"><text x="46" y="70" font-size="13" letter-spacing="3">STATE → MODEL → PLAN → CONTROL</text><text x="52" y="390" font-size="13">predicted path</text><text x="685" y="472"