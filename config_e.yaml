defaults:
    - override hydra/launcher: submitit_local

# environment
task: PyFlyt/Rocket-Landing-v4
device: cuda:0
obs: state
episodic: True
mode: nominal

# evaluation
checkpoint: /mnt/LAB/Private/在读学生文件/陈东和/rocket_new/harmony/logs/PyFlyt/Rocket-Landing-v4/1/default/models/final.pt
eval_episodes: 10000
eval_freq: 10000

# training
steps: 2500000
batch_size: 256
harmony: true
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 500_000
exp_name: default
data_dir: ???

# planning
mpc: true
iterations: 3
num_samples: 64
num_elites: 32
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 1
temperature: 0.2

# actor
